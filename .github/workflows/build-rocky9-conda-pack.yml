name: Build Rocky Linux 9 offline conda-pack

on:
  workflow_dispatch:
    inputs:
      backend:
        description: PyTorch hardware backend
        required: true
        default: cpu
        type: choice
        options:
          - cpu
          - cu126
          - cu130
          - rocm
          - xpu
      include_models:
        description: Include all model weights (~10 GB; normally needs a larger/self-hosted runner)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Rocky 9 / ${{ inputs.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: rockylinux:9.5

    steps:
      - name: Install container prerequisites
        run: dnf install -y bzip2 findutils git gzip tar xz

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ""
          init-shell: bash
          post-cleanup: all

      - name: Build and verify conda-pack
        id: build
        shell: bash -el {0}
        env:
          BACKEND: ${{ inputs.backend }}
          INCLUDE_MODELS: ${{ inputs.include_models }}
        run: |
          args=(--backend "$BACKEND")
          if [[ "$INCLUDE_MODELS" == "true" ]]; then
            args+=(--include-models)
          fi
          bash scripts/build-rocky9-conda-pack.sh "${args[@]}"
          archive="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload archive and SHA-256 checksum
        uses: actions/upload-artifact@v7
        with:
          name: sammie-roto-2-rocky9-x86_64-${{ inputs.backend }}
          path: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.archive }}.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
